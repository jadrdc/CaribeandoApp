# --- 2026-08-19 modernization pass -----------------------------------------------------------
# Full audit against Maven Central / mvnrepository / GitHub releases done today. Kotlin (2.3.20),
# Compose Multiplatform (1.11.1), Ktor (3.5.2), Koin (4.2.2), KSP (2.3.9), and Coil3 (3.4.0) were
# ALL already current as of this pass — verified, not re-bumped. Everything below documents what
# actually changed and why, plus the handful of deliberate holds carried over from 2026-08-18.
#
# Bumped (verified against the real changelog/release notes, not guessed):
#   - firebaseBom 33.16.0 -> 34.17.0. Firebase's 34.x line raised the KTX modules' functionality
#     into the main artifacts and dropped standalone `-ktx` publishing — a real breaking change,
#     but only for code that depends on the `-ktx` artifact suffix. This catalog never declared
#     `-ktx` modules (firebase-auth/-analytics/-firestore are all the main artifact names
#     already), so this project isn't exposed to that break. minSdk also rose to API 23 in 34.x;
#     this project's minSdk is already 24, so no impact there either.
#   - stripeJava 28.0.0 -> 33.3.0 (client catalog only — caribeando-backend pins its own
#     stripe-java independently in its build.gradle.kts and needs the same bump made separately).
#   - datastore 1.1.1 -> 1.2.1.
#   - appcompat 1.7.0 -> 1.8.0.
#   - androidx-constraintlayout 2.2.0 -> 2.2.1 (2.2.2 also exists on mvnrepository but with a
#     forward-dated release date that looked like a placeholder/scheduled entry, not a real
#     confirmed release — held at the clearly-real 2.2.1 rather than trust that).
#   - androidx-espresso-core 3.6.1 -> 3.7.0.
#   - androidx-test-junit 1.2.1 -> 1.3.0.
#   - lottieComposeVersion 5.0.0 -> 6.7.1. Note: grepping composeApp/src found ZERO actual usage
#     of any Lottie composable (rememberLottieComposition/LottieAnimation/etc.) despite the
#     dependency being declared — it may be genuinely dead weight. Left the dependency in place
#     (removing an unused-but-declared dependency is a bigger call than a version bump) but
#     flagging it here: worth confirming with Agustin whether this can be dropped entirely.
#   - mapsComposeVersion 6.2.1 -> 8.4.0. This crosses two major versions with real breaking
#     changes per the library's own changelog (v7.0.0 bumped its required Compose version,
#     v8.0.0 bumped its required Maps SDK to 20.0.0) — but this project's actual usage
#     (MapComponent.android.kt: GoogleMap/rememberCameraPositionState/MapProperties/MapType/
#     MapUiSettings/Circle) is all long-stable core API untouched by either breaking-change note,
#     and playServicesMaps was ALREADY pinned to 20.0.0 (the exact version v8.0.0 requires) and
#     Compose Multiplatform is already far ahead of what v7.0.0 needed. Prerequisites already
#     satisfied; still worth a real build to confirm, same as everything else in this pass.
#   - firebaseCrashlytics (the dev.gitlive KMP wrapper, NOT the Gradle plugin below) 2.1.0 -> 2.6.0.
#   - coreI18n 1.0.0-alpha01 -> 1.0.0 — a real stable release now exists; no reason to stay on an
#     alpha.
#   - Root build.gradle.kts Gradle plugin versions (not in this catalog, see that file): the
#     `com.google.gms.google-services` plugin 4.4.2 -> 4.5.0, and `com.google.firebase.crashlytics`
#     plugin 3.0.2 -> 3.0.7.
#   - kotlinxDatetime 0.6.2 -> 0.8.0, PAIRED with a source migration off kotlinx.datetime.Clock/
#     Instant onto kotlin.time.Clock/Instant across all 12 previously-affected files. This was
#     explicitly held back on 2026-08-18 because there was no ready-made ISO-8601 serializer for
#     kotlin.time.Instant at the time — that's no longer true: kotlinx.serialization 1.9.0
#     (2025-06-27) shipped a genuine built-in `Instant.serializer()` producing the same
#     `Instant.toString()` ISO-8601 format the old kotlinx.datetime.Instant default used, and
#     this catalog's kotlinSerialization (1.11.0) is already well past that threshold. See the
#     per-file changes for exactly how each @Serializable field now opts in
#     (`@Serializable(with = ...)` / `@OptIn(ExperimentalTime::class)` as needed — `kotlin.time.
#     Instant`'s serializer is still marked @ExperimentalTime upstream).
#
# Verified already current, left untouched:
#   - kotlin 2.3.20, compose-plugin 1.11.1, koin 4.2.2, ktor-client/ktorClientAuth 3.5.2,
#     ksp 2.3.9, coil3 3.4.0, playServicesAuth 21.6.0, playServicesMaps 20.0.0, sqlite 2.7.0,
#     navigation-compose 2.9.2 (2.10.0 only exists as an alpha — not adopted), junit 4.13.2.
#
# Removed (confirmed dead — zero references anywhere in either build.gradle.kts or
# composeApp/src, beyond the catalog entry itself and Gradle's auto-generated accessors):
#   - composeAuth / compose-auth / gotrue-kt (Supabase auth). This project's real auth story
#     (per CLAUDE.md, confirmed against actual source) is email/password + Google + Apple Sign-In
#     with a JWT access/refresh pair against caribeando-backend — no Supabase involved anywhere.
#     Looks like leftover scaffolding from an earlier direction that was never wired in.
#   - materialIconsExtended / materialIconsExtendedVersion. The real Material Icons Extended
#     dependency is `compose.materialIconsExtended` (the Compose Multiplatform artifact itself,
#     tied to compose-plugin's version) declared directly in composeApp/build.gradle.kts — these
#     two catalog version entries were never actually referenced by any library entry.
#   - firebaseCore. Not referenced by any library entry in this catalog or any build.gradle.kts.
#
# Deliberately still held back (unchanged from 2026-08-18, reasons still apply):
#   - AGP: bumped to 9.2.0 as part of TODAY's pass, but only alongside the required module split
#     (:composeApp -> :androidApp + :composeApp-as-KMP-library) — see the top-level project
#     structure changes, not this file, for that. AGP 9 is not just a version-catalog change.
#   - Gradle wrapper bumped 8.13 -> 9.4.1 to match AGP 9.2.0's minimum requirement.
#   - android-compileSdk bumped 36 -> 37 (Android 17 / API 37): a real build failed AAR-metadata
#     checks because maps-compose 8.4.0 (and its transitive maps-ktx 6.2.0), plus androidx.core
#     1.19.0 pulled in via other bumped deps, all require compileSdk 37+. targetSdk stays at 36
#     deliberately -- only the compile-time API surface needed to move, not the app's declared
#     runtime-behavior opt-in. Android SDK Platform 37 may need to be installed via the SDK
#     Manager if Android Studio hasn't already fetched it.
